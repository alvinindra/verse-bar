name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Swift version
        run: swift --version

      - name: Build app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Ad-hoc codesign
        run: |
          # Ad-hoc signing (identity "-") quiets some Gatekeeper noise on
          # first launch. For a fully-trusted install we'd need an Apple
          # Developer ID and notarization — out of scope for this project.
          /usr/bin/codesign --force --deep --sign - "Verse Bar.app"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "Verse Bar.app" || true

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent "Verse Bar.app" "VerseBar-${GITHUB_REF_NAME}.zip"

      - name: Build DMG
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME}"
          STAGING="dmg-staging"
          DMG_NAME="VerseBar-${VERSION}.dmg"

          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R "Verse Bar.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          # README inside DMG for first-time users
          cat > "$STAGING/INSTALL.txt" <<'EOF'
          Verse Bar — install

          1. Drag "Verse Bar" onto the "Applications" shortcut.
          2. Open Applications, right-click "Verse Bar", choose Open.
             (Required only on first launch — the app is ad-hoc signed,
             not notarized, so macOS Gatekeeper will warn once.)
          3. Grant Automation permission for your browser when prompted.

          Source & docs: https://github.com/alvinindra/verse-bar
          EOF

          hdiutil create \
            -volname "Verse Bar" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            -fs HFS+ \
            "$DMG_NAME"

      - name: Generate checksums
        run: |
          shasum -a 256 "VerseBar-${GITHUB_REF_NAME}.dmg" > "VerseBar-${GITHUB_REF_NAME}.dmg.sha256"
          shasum -a 256 "VerseBar-${GITHUB_REF_NAME}.zip" > "VerseBar-${GITHUB_REF_NAME}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            **Recommended:** download the `.dmg`, double-click, then drag **Verse Bar** onto the **Applications** shortcut.

            On first launch macOS will warn that the developer can't be verified — right-click the app and choose **Open** to bypass (the app is ad-hoc signed, not notarized).

            ### Files

            | File | Notes |
            |---|---|
            | `VerseBar-${{ github.ref_name }}.dmg` | Recommended — drag-to-install disk image |
            | `VerseBar-${{ github.ref_name }}.zip` | Plain zip of the `.app` bundle |
            | `*.sha256` | Checksums |
          files: |
            VerseBar-${{ github.ref_name }}.dmg
            VerseBar-${{ github.ref_name }}.dmg.sha256
            VerseBar-${{ github.ref_name }}.zip
            VerseBar-${{ github.ref_name }}.zip.sha256
