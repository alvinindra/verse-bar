name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Swift version
        run: swift --version

      - name: Build app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent "Verse Bar.app" "VerseBar-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "VerseBar-${GITHUB_REF_NAME}.zip" > "VerseBar-${GITHUB_REF_NAME}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            VerseBar-${{ github.ref_name }}.zip
            VerseBar-${{ github.ref_name }}.zip.sha256
